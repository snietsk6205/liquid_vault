name: Build

# From the github-fast-ci skill (Liquid Launcher's CI). A push builds and runs the unit tests. The emulator test runs on
# "[release]" commits, on commits whose message contains "[smoke]", on manual runs, and when the push changed the risky
# paths below. A release is published only when the head commit's message contains "[release]" (the whole message,
# body included: never quote the marker in other commits), only after every check passed, and only when the APK is
# signed with the real key from the repository's secrets (DECISIONS.md, D4). Release notes are that version's section
# of CHANGELOG.md, checked before anything is built. versionCode is the run number.

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'ccr-*'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release from this build
        type: boolean
        default: false

# A newer push to the same branch cancels the running build. Do not push while a release run is going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: LiquidVault
  # Changes that need the emulator: the manifest, the profile-owner, channel, bridge and shell code, CI itself.
  RISKY_PATHS: '^(app/src/main/AndroidManifest|app/src/main/kotlin/dev/liquid/vault/(admin|channel|bridge|shell|automation|diag)/|ci/|\.github/workflows/)'

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
      smoke: ${{ steps.smoke.outputs.smoke }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Every branch saves its Gradle cache (by default only the default branch does), so claude/** branches build warm.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Read version
        id: version
        run: echo "version=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Release or only build
        id: release
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          ASKED: ${{ inputs.release }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release="${ASKED:-false}"
          elif printf '%s' "$MESSAGE" | grep -qF '[release]'; then
            release=true
          else
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Publishes a release: $release"

      - name: Emulator test or not
        id: smoke
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE: ${{ steps.release.outputs.release }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$RELEASE" = "true" ] || printf '%s' "$MESSAGE" | grep -qF '[smoke]'; then
            smoke=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1; then
            smoke=true   # a new branch or a rewritten one: what changed is not known
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qE "$RISKY_PATHS"; then
            smoke=true
          else
            smoke=false
          fi
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Runs the emulator test: $smoke"

      # The signing key lives only in the repository's secrets (this repository is public: no key is committed). The
      # step lists the NAMES of the secrets the repository has (never their values), so a missing one is easy to see.
      - name: Signing key from secrets
        id: signing
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          names=$(printf '%s' "$ALL_SECRETS" | python3 -c 'import json,sys; print(", ".join(sorted(k for k in json.load(sys.stdin) if k.lower() != "github_token")) or "none")')
          echo "Secrets this repository has (names only): $names"
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -z "$missing" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing: with the release key from the secrets"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing:$missing. This build is signed with a throw-away key (APK named test-key) and cannot be released."
          fi

      - name: Check the changelog has this version
        if: steps.release.outputs.release == 'true'
        run: python3 ci/release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

      # The app shows "What's new" from its own copy of the changelog.
      - name: Bundle the changelog in the app
        run: mkdir -p app/src/main/assets && cp CHANGELOG.md app/src/main/assets/CHANGELOG.md

      - name: Unit tests and release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --quiet --console=plain --continue
          testDebugUnitTest :app:assembleRelease
          -PversionCode=${{ github.run_number }}

      - name: Summarise failed unit tests
        if: failure()
        run: python3 ci/test_failures.py

      - name: Collect APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p out
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-test-key"
          cp app/build/outputs/apk/release/app-release.apk \
            "out/${APP_NAME}-${{ steps.version.outputs.version }}-build${{ github.run_number }}${suffix}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # The emulator test (ci/smoke.sh), in two parts on their own runners: "vault" makes the Vault with Android's own setup
  # and checks everything that needs no shell (owner policy, channel, bridges, pause/resume, reboot, destroy); "shell"
  # starts the official Shizuku server, then makes the Vault through the app's shell path (V2), clones, and app-ops.
  smoke:
    name: Emulator test, ${{ matrix.part }}
    needs: build
    if: needs.build.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [vault, shell]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Official Shizuku (shell part)
        if: matrix.part == 'shell'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shizuku
          gh release download --repo RikkaApps/Shizuku --pattern '*.apk' --dir out/shizuku
          ls -la out/shizuku

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot helper
        run: python3 -m pip install --quiet --user pillow || true

      - name: Runner CPU
        run: |
          echo "$(nproc) CPUs:$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"

      # The system image and a booted, settled emulator's snapshot are kept between runs. A snapshot only loads with the
      # core count it was saved with. 2 cores: with no GPU, swiftshader draws on the same CPUs; 4 were no faster.
      - name: System image cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: sysimg-34-google_apis-x86_64-v1

      - name: Emulator snapshot cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1

      - name: Boot once and save the snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/settle.sh 300

      - name: Run on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh ${{ matrix.part }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output-${{ matrix.part }}
          path: out/smoke/
          retention-days: 14

  release:
    name: Publish release
    needs: [build, smoke]
    # A release always runs the emulator test, and only an APK signed with the release key is published.
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an APK not signed with the release key
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::Not published: the signing secrets are missing, so this APK is signed with a throw-away key and could not be updated later. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD (docs/QUESTIONS.md, Q1), then run the workflow again with 'release'."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Release notes from CHANGELOG.md
        run: |
          python3 ci/release_notes.py "${{ needs.build.outputs.version }}" > notes.md
          printf '\n---\nBuild %s from `%s`. Install the APK below: it installs over the previous build and keeps everything.\n' \
            "${{ github.run_number }}" "${{ github.sha }}" >> notes.md
          cat notes.md

      # One APK per release: a newer build of the same version replaces the old file.
      - name: Remove older APKs from this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r name; do
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
              done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Liquid Vault ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body_path: notes.md
          make_latest: true
